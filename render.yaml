services:
  - type: worker
    name: inbox-scout
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m inbox_scout.telegram_watch
    envVars:
      - key: PYTHONPATH
        value: src
      - key: TELEGRAM_BOT_TOKEN
        sync: false       # set in Render dashboard — never commit
      - key: TELEGRAM_CHAT_ID
        sync: false       # set in Render dashboard — never commit
      - key: GMAIL_TOKEN_JSON
        sync: false       # base64-encoded token.json — decoded at startup by cloud_startup.py
      - key: GMAIL_TOKEN_MODIFY_JSON
        sync: false       # base64-encoded token_modify.json — decoded at startup
      - key: OPENROUTER_API_KEY
        sync: false       # optional — AI classifier; falls back to rule-based if not set
      - key: ENABLE_TELEGRAM_WATCHER
        sync: false       # must be explicitly set to "true" to start the cloud watcher
    disk:
      name: inbox-scout-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

# Watcher mode — local vs. cloud:
#   The local Windows watcher (started via Start-InboxScoutTelegramWatcher) is the primary
#   Atlas interface. The cloud watcher on Render is disabled by default: telegram_watch.py
#   exits immediately on Linux unless ENABLE_TELEGRAM_WATCHER=true is set.
#   Only set ENABLE_TELEGRAM_WATCHER=true on Render if intentionally switching Atlas to
#   hosted mode. Running both simultaneously causes duplicate Telegram replies (409 conflict).
#
# Deployment notes:
#
# Token setup:
#   cloud_startup.py runs at watcher startup. It decodes GMAIL_TOKEN_JSON and
#   GMAIL_TOKEN_MODIFY_JSON from base64 and writes them to the expected paths
#   only if the files do not already exist (safe for local dev too).
#
#   To encode your tokens:
#     PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("token.json")) | clip
#     Linux:      base64 -w 0 token.json
#
# AI classification:
#   Ollama is unavailable on Render. With OPENROUTER_API_KEY set, classification
#   uses OpenRouter (google/gemini-2.5-flash-lite or similar). Without it,
#   rule-based classification runs only. No Gmail safety behavior changes.
#
# Linux compatibility:
#   kill_stale_watchers() and refuse_global_python() skip Windows-only logic
#   on Linux. Port-lock (socket) handles duplicate-instance prevention.
#
# Data persistence:
#   Queue, log, and report files are written to data/ under the project root.
#   The 1GB disk mount keeps them across deploys on Render.
